name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1" # weekly, to notice GitHub API changes early
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  live-api:
    # Renders real cards against the GitHub API, so schema or behaviour
    # changes on GitHub's side fail here before they reach anyone's profile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/galaxy-stats -user "${{ github.repository_owner }}" -out "$RUNNER_TEMP/cards"

  action:
    # Runs the action end to end, including publishing, the way users run it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          branch: ci-preview
      - name: Check published cards
        run: |
          git fetch --quiet --depth=1 origin ci-preview
          for card in galaxy nightsky kubectl; do
            git show "FETCH_HEAD:$card.svg" | head -c 4 | grep -q '<svg'
          done
