<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="gs-title gs-desc" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><title id="gs-title">Commit forecast for astro-dev</title><desc id="gs-desc">Commit forecast for astro-dev: 14 commits per day over the last 14 days.</desc><defs><linearGradient id="fc-sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7de1"/><stop offset="1" stop-color="#0b2a5b"/></linearGradient></defs><style>.fc-drift{animation:fc-drift 7s ease-in-out infinite alternate}@keyframes fc-drift{to{transform:translateX(8px)}}.fc-glow{animation:fc-glow 4s ease-in-out infinite}@keyframes fc-glow{50%{opacity:.7}}@media (prefers-reduced-motion:reduce){.fc-drift,.fc-glow{animation:none}}</style><rect width="720" height="300" rx="10" fill="url(#fc-sky)"/><text x="24" y="34" fill="#fff" font-size="15" font-weight="700" letter-spacing="2">COMMIT FORECAST</text><text x="222" y="34" fill="#a9c7ff" font-size="11">astro-dev · issued 23 Oct 2026 · Europe/Berlin</text><g class="fc-glow"><circle cx="96.0" cy="136.0" r="28" fill="#ffd34d"/><g stroke="#ffd34d" stroke-width="4" stroke-linecap="round"><path d="M134.0 136.0L144.0 136.0"/><path d="M122.9 162.9L129.9 169.9"/><path d="M96.0 174.0L96.0 184.0"/><path d="M69.1 162.9L62.1 169.9"/><path d="M58.0 136.0L48.0 136.0"/><path d="M69.1 109.1L62.1 102.1"/><path d="M96.0 98.0L96.0 88.0"/><path d="M122.9 109.1L129.9 102.1"/></g></g><text x="190" y="128" fill="#fff" font-size="44" font-weight="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">14°c</text><text x="192" y="150" fill="#a9c7ff" font-size="11">commits per day · 14-day average · sunny</text><text x="190" y="186" fill="#eaf2ff" font-size="12.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">• Heavy commit activity, peaking around 23:00.</text><text x="190" y="208" fill="#eaf2ff" font-size="12.5" font-family="-apple-system,Segoe UI,Helve